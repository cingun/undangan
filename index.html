<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syifa & Sukma | Wedding Invitation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-handwritten { font-family: 'Kalam', cursive; }
        .font-clean { font-family: 'Outfit', sans-serif; }
        body { background-color: #f7f5f2; color: #4a453f; }
        h1, h2, h3 { font-family: 'Kalam', cursive; }
        .fade-element { opacity: 0; transform: translateY(20px); transition: all 1s ease-out; }
        .fade-element.appear { opacity: 1; transform: translateY(0); }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { animation: marquee 30s linear infinite; }
    </style>
</head>
<body class="font-clean overflow-hidden" id="body-lock">

    <!-- AUDIO -->
    <audio id="bg-music" loop>
        <source src="https://raw.githubusercontent.com/cingun/undangan/main/music.mp3" type="audio/mpeg">
    </audio>

    <!-- COVER -->
    <div id="cover" class="fixed inset-0 z-50 flex flex-col items-center justify-between p-10 text-center bg-[#fdfbf9] transition-all duration-1000">
        <div class="mt-10 text-xs tracking-[0.3em] uppercase text-stone-400">Pernikahan Suci</div>
        <div class="my-auto">
            <h1 class="text-6xl text-stone-700 font-handwritten">Syifa & Sukma</h1>
            <p class="mt-6 text-stone-500 italic font-handwritten text-lg">31 Desember 2026</p>
        </div>
        <button onclick="openInvitation()" class="mb-16 border border-stone-800 px-10 py-3 text-sm uppercase tracking-widest hover:bg-stone-800 hover:text-white transition-all rounded-full">
            Buka Undangan
        </button>
    </div>

    <!-- MAIN -->
    <main class="max-w-md mx-auto min-h-screen shadow-2xl bg-[#fdfbf9] relative">
        
        <!-- HERO & TIMER -->
        <section class="h-screen flex flex-col items-center justify-center p-6 text-center">
            <h2 class="text-5xl mb-8">Menuju Hari Bahagia</h2>
            <div class="grid grid-cols-4 gap-4 w-full">
                <div class="bg-stone-200 p-2 rounded-lg"><span id="days" class="block text-xl font-bold">00</span><span class="text-[9px] uppercase">Hari</span></div>
                <div class="bg-stone-200 p-2 rounded-lg"><span id="hours" class="block text-xl font-bold">00</span><span class="text-[9px] uppercase">Jam</span></div>
                <div class="bg-stone-200 p-2 rounded-lg"><span id="minutes" class="block text-xl font-bold">00</span><span class="text-[9px] uppercase">Menit</span></div>
                <div class="bg-stone-200 p-2 rounded-lg"><span id="seconds" class="block text-xl font-bold">00</span><span class="text-[9px] uppercase">Detik</span></div>
            </div>
        </section>

        <!-- PROFIL -->
        <section class="fade-element py-16 px-8 text-center space-y-10">
            <h3 class="text-4xl">Mempelai</h3>
            <div class="space-y-6 font-handwritten text-xl">
                <p>Syifa Syahrul<br><span class="text-[10px] text-stone-400 font-sans uppercase tracking-widest">Putra dari Bpk. Ibrahim</span></p>
                <div class="text-stone-300">— & —</div>
                <p>Eva Nurningsih<br><span class="text-[10px] text-stone-400 font-sans uppercase tracking-widest">Putri dari Bpk. Idris</span></p>
            </div>
        </section>

        <!-- LOKASI -->
        <section class="fade-element py-16 px-8 text-center bg-stone-100">
            <h3 class="text-3xl mb-6">Lokasi Acara</h3>
            <p class="text-sm text-stone-600 mb-6">Masjid Agung Kudus & Gedung Hotel Harmoni</p>
            <a href="https://maps.google.com" class="inline-block border border-stone-800 px-6 py-2 text-xs uppercase tracking-widest hover:bg-stone-800 hover:text-white transition-all rounded-full">Buka Maps</a>
        </section>

        <!-- RSVP -->
        <section class="fade-element py-16 px-8 space-y-6">
            <h3 class="text-4xl text-center">RSVP</h3>
            <form id="rsvp-form" class="space-y-4">
                <input type="text" id="form-name" placeholder="Nama Anda" class="w-full p-3 border border-stone-300 rounded-lg bg-transparent" required>
                <select id="form-status" class="w-full p-3 border border-stone-300 rounded-lg bg-transparent">
                    <option value="Hadir">Hadir</option>
                    <option value="Tidak Hadir">Tidak Hadir</option>
                </select>
                <button type="submit" class="w-full bg-stone-800 text-white p-3 rounded-lg hover:bg-stone-700 transition">Kirim Konfirmasi</button>
            </form>
        </section>
    </main>

    <script>
        function openInvitation() {
            document.getElementById('cover').style.transform = 'translateY(-100%)';
            document.getElementById('body-lock').classList.remove('overflow-hidden');
            document.querySelectorAll('.fade-element').forEach(el => el.classList.add('appear'));
            document.getElementById('bg-music').play().catch(() => console.log("Musik butuh interaksi"));
        }

        const targetDate = new Date("2026-12-31T09:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;
            document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
            document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000);
        }, 1000);

        document.getElementById('rsvp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Terima kasih, konfirmasi Anda telah tercatat!');
        });
    </script>
</body>
</html>
